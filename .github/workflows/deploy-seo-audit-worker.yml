name: Deploy Do2Earn SEO Audit Worker

on:
  push:
    branches:
      - main
    paths:
      - "do2earn-seo-bot/worker/**"
      - ".github/workflows/deploy-seo-audit-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy SEO audit engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        id: credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Worker deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
          fi
      - name: Deploy to Cloudflare Workers
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: do2earn-seo-bot/worker
          command: deploy
