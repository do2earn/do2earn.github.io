<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do2Earn</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff;
      color: #222;
    }
    main {
      width: 100%;
      max-width: 600px;
      padding: 40px 24px;
    }
    .do2earn-logo {
      width: min(240px, 70vw);
      height: auto;
      display: block;
      margin: 0 auto 24px;
    }
    .tagline {
      margin: 0 0 42px;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .project-card {
      margin: 0 auto;
      max-width: 560px;
      padding: 28px 24px 30px;
      background: #f8f9fa;
      border: 1px solid #e2e6ea;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .project-link {
      display: inline-block;
    }
    .steemflags-logo {
      width: min(260px, 75vw);
      height: auto;
      display: block;
      margin: 0 auto 20px;
      transition: transform 0.2s ease;
    }
    .project-link:hover .steemflags-logo {
      transform: scale(1.03);
    }
    .project-info {
      margin: 0 auto 18px;
      max-width: 520px;
      text-align: left;
      line-height: 1.8;
      font-size: 1rem;
    }
    .project-info a {
      color: #06c;
      text-decoration: none;
    }
    .project-info a:hover {
      text-decoration: underline;
    }
    .play-now {
      display: inline-block;
      margin-top: 8px;
      padding: 11px 24px;
      background: #0d6efd;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .play-now:hover {
      background: #0b5ed7;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main>
    <img class="do2earn-logo" src="assets/Do2Earn_Logo.png" alt="Do2Earn">

    <p class="tagline"><h1>Web 3.0 Projects Developer</h1></p>

    <section class="project-card">
      <a class="project-link" href="https://steemflags.do2earn.dev" target="_blank" rel="noopener" aria-label="Open Steem Flags">
        <img class="steemflags-logo" src="assets/steemflags_logo.png" alt="Steem Flags">
      </a>

      <div class="project-info">
        🔵 Project Name: <a href="https://steemflags.do2earn.dev" target="_blank" rel="noopener">Steem Flags</a><br>
        🔵 Category: Game<br>
        🔵 Genres: Quiz, Education<br>
        🔵 Blockchain: <a href="https://coinmarketcap.com/currencies/steem/" target="_blank" rel="noopener">Steem</a><br>
        🔵 Assets: D2E, <a href="https://coinmarketcap.com/currencies/steem/" target="_blank" rel="noopener">$STEEM</a><br>
        ℹ️ <a href="https://steemflags.do2earn.dev/about.html" target="_blank" rel="noopener">More Information</a>
      </div>

      <a class="play-now" href="https://steemflags.do2earn.dev" target="_blank" rel="noopener">Play Now</a>
    </section>
  </main>
</body>
</html>
